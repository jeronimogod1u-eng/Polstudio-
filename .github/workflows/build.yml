
name: Build POLSTUDIO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'POLSTUDIO-Android-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -q POLSTUDIO-Android-source.zip -d project
          ls -la project/POLSTUDIO-Android

      - name: Build APK
        run: |
          gradle -p project/POLSTUDIO-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POLSTUDIO-APK
          path: project/POLSTUDIO-Android/app/build/outputs/apk/debug/*.apk
