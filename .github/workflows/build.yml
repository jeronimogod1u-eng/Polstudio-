name: Build POLSTUDIO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'POLSTUDIO-Android-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q POLSTUDIO-Android-source.zip -d project
          echo "PROJECT_DIR=$(find project -name gradlew -type f -printf '%h\n' | head -1)" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: POLSTUDIO-APK
          path: project/**/*.apk
